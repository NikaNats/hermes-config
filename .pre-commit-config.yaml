# Pre-commit hooks (spec 5.6 enforcement, R-13: beyond gitleaks).
# Install:  pipx install pre-commit && pre-commit install
# Run all:  pre-commit run --all-files
# Revisions verified 2026-08-05 via git ls-remote --tags.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ["-d", "relaxed"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-symlinks        # guards prompts/base.md -> ../SOUL.md
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
  # R4: hardline scanner regression corpus — BLOCK/ALLOW expectations must
  # hold on every commit (scripts/hardline-corpus-test.sh, 40 cases).
  - repo: local
    hooks:
      - id: hardline-corpus
        name: hardline scanner regression corpus
        entry: bash scripts/hardline-corpus-test.sh
        language: system
        pass_filenames: false
        always_run: true
