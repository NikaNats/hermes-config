# Pre-commit hook: gitleaks secret scanning (spec 5.6 enforcement).
# Install:  pipx install pre-commit && pre-commit install
# Run all:  pre-commit run --all-files
# Latest verified rev: v8.30.1 (git ls-remote --tags, 2026-08-03)
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
